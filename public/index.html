<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAR SMB WEB</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true" data-icon="archive"></div>
          <div class="brand-text">
            <h1 class="brand-title" aria-label="RAR SMB WEB">RAR<span class="brand-dot">·</span>SMB<span class="brand-dot">·</span><span class="brand-accent">WEB</span></h1>
            <p class="brand-flow"><span>Descargar</span><span>Extraer</span><span>Transferir por SMB</span></p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-button" type="button" title="Cambiar tema" aria-label="Cambiar tema" data-icon-slot></button>
          <button id="refreshFiles" class="icon-button" type="button" title="Actualizar archivos" aria-label="Actualizar archivos" data-icon="refresh"></button>
        </div>
      </header>

      <section class="workspace">
        <div class="panel flow-panel">
          <h2>Descargar</h2>
          <form id="downloadForm" class="form-grid">
            <label class="wide">
              <span>URL del archivo</span>
              <input id="urlInput" name="url" type="url" autocomplete="url" placeholder="https://Ingrese-URL-Descarga" required>
            </label>
            <label>
              <span>Contraseña si es comprimido</span>
              <input id="rarPasswordInput" name="archivePassword" type="password" autocomplete="off">
            </label>
            <label class="wide check-label">
              <input id="deleteRarAfterExtract" name="deleteArchiveAfterExtract" type="checkbox" value="1">
              <span>Borrar el .rar después de extraer</span>
            </label>
            <div class="form-actions wide">
              <button class="ghost-button" type="button" data-clear-form="downloadForm">Limpiar campos</button>
              <button class="primary-button" type="submit">Descargar</button>
            </div>
          </form>

          <div class="job-stack" id="downloadJobs" aria-live="polite"></div>
        </div>

        <div class="panel transfer-panel">
          <h2>Transferir por SMB</h2>
          <form id="transferForm" class="form-grid">
            <label class="wide">
              <span>Ruta SMB</span>
              <input id="smbRouteInput" name="route" type="text" placeholder="//192.168.xx.xxx/Carpeta-X/Carpeta-Z" required>
            </label>
            <label>
              <span>Usuario</span>
              <input id="smbUserInput" name="username" type="text" autocomplete="username" required>
            </label>
            <label>
              <span>Contraseña</span>
              <input id="smbPasswordInput" name="password" type="password" autocomplete="off" required>
            </label>
            <label>
              <span>Dominio</span>
              <input id="smbDomainInput" name="domain" type="text" placeholder="Opcional">
            </label>
            <label class="wide check-label">
              <input id="deleteLocalAfterTransfer" name="deleteLocalAfterTransfer" type="checkbox" value="1">
              <span>Borrar después de transferir</span>
            </label>
            <div class="form-actions wide">
              <button class="ghost-button" type="button" data-clear-form="transferForm">Limpiar campos</button>
              <button class="primary-button" type="submit">Transferir selección</button>
            </div>
          </form>

          <div class="job-card" id="transferJob" hidden>
            <div class="job-line">
              <strong id="transferStatus">Preparando</strong>
              <span id="transferPercent">0%</span>
            </div>
            <progress id="transferProgress" max="100" value="0"></progress>
            <p id="transferMessage"></p>
          </div>
        </div>
      </section>

      <section class="file-manager">
        <div class="file-toolbar">
          <div>
            <h2>Gestor de archivos</h2>
            <nav id="breadcrumbs" class="breadcrumbs" aria-label="Ruta actual"></nav>
          </div>
          <div class="toolbar-actions">
            <span id="selectionCount" class="selection-count" hidden></span>
            <button id="goUp" type="button" title="Subir carpeta" aria-label="Subir carpeta" data-icon="up"></button>
            <button id="newFolder" type="button" data-icon="folder-plus" data-label="Nueva carpeta"></button>
            <button id="moveSelected" type="button" data-icon="move" data-label="Mover selección"></button>
            <button id="deleteSelected" type="button" data-icon="trash" data-label="Borrar selección"></button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="check-cell"><input id="selectAll" type="checkbox" aria-label="Seleccionar todo"></th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Tamaño</th>
                <th>Modificado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="fileRows">
              <tr>
                <td colspan="6" class="empty-state">Cargando archivos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="moveDialog" class="move-dialog">
      <form method="dialog" class="move-card">
        <h3 id="moveTitle">Mover selección</h3>
        <p class="move-hint">Elige la carpeta de destino.</p>
        <nav id="moveCrumbs" class="breadcrumbs" aria-label="Destino"></nav>
        <ul id="moveFolders" class="move-folders"></ul>
        <div class="move-actions">
          <button value="cancel" type="submit">Cancelar</button>
          <button id="moveConfirm" class="primary-button" type="button">Mover aquí</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" class="move-dialog delete-dialog">
      <form method="dialog" class="move-card">
        <h3 id="deleteTitle">Borrar selección</h3>
        <p class="move-hint">Esta acción no se puede deshacer.</p>
        <ul id="deleteList" class="delete-list"></ul>
        <div class="move-actions">
          <button value="cancel" type="submit">Cancelar</button>
          <button id="deleteConfirm" class="danger-button" type="button">Borrar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
